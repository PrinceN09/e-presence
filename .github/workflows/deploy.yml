name: Deploy e-Présence

on:
  push:
    branches: [main]

jobs:
  # ─── 1. BUILD CHECK ───────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & type-check backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Install & type-check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ─── 2. DEPLOY ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build  # only runs if build passes

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            cd /opt/e-presence

            echo "── Pulling latest code ──"
            git pull origin main

            echo "── Rebuilding containers ──"
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "── Waiting for app to start ──"
            sleep 30

            echo "── Health check ──"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health)
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed (HTTP $STATUS) — rolling back"
              git stash
              docker compose -f docker-compose.prod.yml up -d
              exit 1
            fi

            echo "✅ Deployed successfully"

      - name: Notify success
        if: success()
        run: echo "🚀 e-Présence deployed to https://www.e-presence.org"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed — server rolled back to previous version"
