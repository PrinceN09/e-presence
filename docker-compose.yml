version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: epresence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epresence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epresence_pass}
      POSTGRES_DB: ${POSTGRES_DB:-epresence}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epresence']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epresence-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-epresence}:${POSTGRES_PASSWORD:-epresence_pass}@db:5432/${POSTGRES_DB:-epresence}
      TZ: Africa/Kinshasa

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epresence-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: ./frontend/.env.local
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000/api

volumes:
  postgres_data:
